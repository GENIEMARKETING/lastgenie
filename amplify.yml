version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            - cd client
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: client
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - client/node_modules/**/*
          - client/.next/cache/**/*
